<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>తెలుగు వన్ వర్డ్ ప్రశ్నలు 1-250 - రీడింగ్ యాప్</title>
<style>
  :root {
    --bg: #fdf6ec;
    --card: #ffffff;
    --accent: #b34700;
    --accent2: #d97706;
    --text: #2b2016;
    --muted: #7a6a55;
    --border: #eadfca;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1712;
      --card: #2a2219;
      --accent: #ffb347;
      --accent2: #f59e0b;
      --text: #f4ecdd;
      --muted: #cbb994;
      --border: #453a2b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1712;
    --card: #2a2219;
    --accent: #ffb347;
    --accent2: #f59e0b;
    --text: #f4ecdd;
    --muted: #cbb994;
    --border: #453a2b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans Telugu", "Gautami", sans-serif;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    text-align: center;
    padding: 22px 16px 16px;
    background: linear-gradient(180deg, var(--accent2) 0%, var(--bg) 100%);
  }
  header img {
    width: 108px; height: 108px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--card);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  header h1 {
    font-size: 1.25rem;
    margin: 12px 0 2px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
  header p {
    margin: 0;
    font-size: 0.85rem;
    color: #fff;
    opacity: 0.9;
  }
  .info-bar {
    max-width: 640px;
    margin: 10px auto 0;
    padding: 10px 16px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 8px 14px 40px;
  }
  .qcard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    position: relative;
  }
  .qcard:active { transform: scale(0.985); }
  .qcard.playing {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent) inset;
  }
  .qnum {
    display: inline-block;
    background: var(--accent2);
    color: #fff;
    font-weight: 700;
    font-size: 0.78rem;
    padding: 2px 9px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .qtext {
    font-size: 1rem;
    line-height: 1.5;
    margin: 0 0 8px;
    font-weight: 600;
  }
  .answer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .answer {
    background: rgba(179,71,0,0.08);
    color: var(--accent);
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .expl {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.45;
    border-top: 1px dashed var(--border);
    padding-top: 8px;
  }
  .play-icon {
    margin-left: auto;
    font-size: 1.15rem;
    color: var(--accent2);
    flex-shrink: 0;
  }
  .controls {
    max-width: 640px;
    margin: 4px auto 0;
    padding: 0 14px 6px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .btn {
    background: var(--accent2);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.secondary {
    background: transparent;
    color: var(--accent2);
    border: 1.5px solid var(--accent2);
  }
  footer {
    text-align: center;
    padding: 22px 16px calc(22px + env(safe-area-inset-bottom, 0px));
    font-size: 0.85rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 10px;
  }
  footer b { color: var(--accent); }
  .overflow-wrap { overflow-x: auto; }

  .tabs {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--bg);
    display: flex; gap: 8px; overflow-x: auto;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    max-width: 640px; margin: 0 auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    flex: 0 0 auto;
    background: transparent; color: var(--accent2);
    border: 1.5px solid var(--accent2);
    padding: 6px 14px; border-radius: 999px;
    font-size: 0.85rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .tab.active { background: var(--accent2); color: #fff; }
</style>
</head>

<script>
const SETS = [[["1", "కన్నతల్లి మనసును కష్టపెట్టకూడదు అని వేమన ఎవరిని ఉద్దేశించి చెప్పాడు?", "అమ్మ", "వేమన పద్యంలో కన్నతల్లి మనసు నొప్పించరాదని, తల్లిదండ్రులు దైవసమానులని చెప్పబడింది."], ["2", "అనువు కాని చోట మనుషులు ఎలా మెలగకూడదని వేమన చెప్పాడు?", "అధికులుగా", "తగని సమయంలో, తగని చోట గొప్పలు ప్రదర్శిస్తే చిన్నబోతారని వేమన హెచ్చరిక."], ["3", "తల్లిదండ్రుల మీద దయలేని పుత్రుడిని వేమన దేనితో పోల్చాడు?", "చెదపురుగు", "పుట్టలో పుట్టి పుట్టనే తినే చెదపురుగులా, దయలేని కొడుకు తల్లిదండ్రులకే కీడు చేస్తాడని భావం."], ["4", "చెట్టును ఏ పురుగు చేరి పాడు చేస్తుంది?", "చెదపురుగు", "వేరుపురుగు వృక్షాన్ని పాడుచేసినట్లే, చెదపురుగు కూడా చెట్టును లోలోపలే తినేసి నాశనం చేస్తుందని పద్యం చెబుతుంది."], ["5", "పిరికివాడు పైకి గంభీరంగా కనిపించినా లోలోపల ఎలా ఉంటాడు?", "పిరికిగా", "బయటకు ధైర్యంగా నటించినా, పిరికివాని మనసులో భయం, పిరికితనమే ఉంటుందని భావం."], ["6", "నీటిలోని మొసలి దేన్ని నీటిలోకి లాగి చంపుతుంది?", "ఏనుగు", "మొసలి తన స్థానబలిమితో నీటిలో ఏనుగునే లాగి చంపగలదని పద్య భావం."], ["7", "పనసతొనలు, పంచదార, తేనె కంటే ఎవరి మాటలు తియ్యగా ఉంటాయని వేమన అన్నాడు?", "స్త్రీల మాటలు (చెలుల మాటలు)", "స్త్రీల మృదువైన మాటలు అన్నిటికంటే మధురంగా ఉంటాయని వేమన వర్ణించాడు."], ["8", "సజ్జనుని మనసును వేమన దేనితో పోల్చాడు?", "మిరియపు గింజ", "మిరియపు గింజ పైకి నల్లగా కనిపించినా లోపల ఘాటుగా (సారవంతంగా) ఉన్నట్లే, సజ్జనుని మనసు కూడా అంతే విలువైనదని భావం."], ["9", "ఏనుగు ఒక్కసారికి ఎన్ని పిల్లలను కంటుంది?", "ఒక్క పిల్లను మాత్రమే", "సంతానం సంఖ్యలో కాదు, గుణంలో గొప్పతనం ఉంటుందని చెప్పే పద్యం ఇది."], ["10", "పాముకు విషం శరీరంలో ఎక్కడ ఉంటుంది?", "తల", "పాము విషం తలలో ఉంటే, తేలు విషం తోకలో ఉంటుందని వేమన వ్యత్యాసాన్ని చెప్పాడు."], ["11", "సంపద ఉన్నప్పుడు ఎవరు వెంటనే వచ్చి చేరతారు?", "బంధువులు", "సంపద ఉన్నప్పుడు బంధువులు, స్నేహితులు అందరూ దగ్గరవుతారని లోకరీతిని వేమన వివరించాడు."], ["12", "మనిషికి అతని సొంత కోపం ఏమి అవుతుంది?", "శత్రువు", "కోపమే మనిషికి అతి పెద్ద శత్రువని, శాంతమే బంధువని వేమన బోధించాడు."], ["13", "వంట చేయడానికి ముఖ్యంగా దేని శుద్ధి అవసరమని పద్యంలో చెప్పారు?", "భాండశుద్ధి (పాత్రల శుద్ధి)", "ఆత్మశుద్ధి, భాండశుద్ధి, చిత్తశుద్ధి — ఏ పనికైనా తగిన శుద్ధి అవసరమని వేమన బోధన."], ["14", "పైన ఇచ్చిన పద్యాలు ఏ శతకానికి చెందినవి?", "వేమన శతకం", "ఈ ప్రశ్నలోని పద్యాలన్నీ 'విశ్వదాభిరామ వినురవేమ' మకుటంతో కూడిన వేమన శతకం నుండి తీసుకున్నవి."], ["15", "మనలను చదివించి, ధర్మార్థ శాస్త్రాలు నేర్పినవారు ఎవరు?", "గురువులు", "విద్యను, ధర్మాన్ని బోధించే గురువుల గొప్పతనాన్ని ఈ పద్యం తెలియజేస్తుంది."], ["16", "పదహారు వేల మంది స్త్రీలను వివాహమాడిన దేవుడు ఎవరు?", "శ్రీకృష్ణుడు", "శ్రీకృష్ణుని మహిమను, ఆయన వివాహాల గురించిన పురాణ గాథను ఈ పద్యం సూచిస్తుంది."], ["17", "బాగా చదువుకుంటే మనిషికి ఏమి కలుగుతుంది?", "మంచిచెడుల విచక్షణ", "విద్య వలన మంచి-చెడులను గుర్తించే వివేకం కలుగుతుందని పద్య భావం."], ["18", "పద్యంలో పేర్కొన్న వ్యసనాలు (దురలవాట్లు) ఎన్ని రకాలు?", "ఏడు (సప్త వ్యసనాలు)", "జూదం, మద్యం వంటి సప్త వ్యసనాలు మనిషిని పాడు చేస్తాయని ఈ పద్యం హెచ్చరిస్తుంది."], ["19", "తపస్సును పాడు చేసేది ఏది?", "క్రోధం (కోపం)", "ఎంతటి తపస్వి అయినా కోపం వస్తే అతని తపఃఫలం నశిస్తుందని భావం."], ["20", "ఆకాశంలో శాశ్వతంగా ఉండేవి ఏవి?", "సూర్యచంద్రులు", "సూర్యచంద్రులు, పర్వతాలు ఉన్నంతకాలం తెలుగు పద్య కవిత జీవించి ఉంటుందని కవి భావన."], ["21", "తెలుగు పద్యం ఎన్ని సంవత్సరాల బంగారు పంటగా అభివర్ణించబడింది?", "వెయ్యి సంవత్సరాలు", "తెలుగు పద్య సాహిత్య వైభవాన్ని వెయ్యి సంవత్సరాల బంగారు పంటగా కవి కొనియాడాడు."], ["22", "ఎవరి కష్టార్జితానికి నష్టం కలిగించరాదని వేమన చెప్పాడు?", "తండ్రి", "తండ్రి కష్టపడి సంపాదించిన దానికి నష్టం కలిగించడం తప్పని భావం."], ["23", "కొండ ఎంత పెద్దదైనా దేనిలో చిన్నదిగా కనిపిస్తుంది?", "అద్దం", "వాస్తవంగా పెద్దదైనా, అద్దంలో ప్రతిబింబం చిన్నదిగా కనిపిస్తుందనే సత్యాన్ని వేమన ఉదాహరణగా చెప్పాడు."], ["24", "తల్లిదండ్రుల మీద దయలేని కుమారుడిని వేమన దేనితో పోల్చాడు?", "పుట్టలోని చెదలు", "తనను పెంచిన వారికే హాని తలపెట్టే కొడుకు, పుట్టను తినే చెదల వంటివాడని భావం."], ["25", "వేరుపురుగు దేనిని నాశనం చేస్తుంది?", "వృక్షం (చెట్టు)", "చిన్న వేరుపురుగు కూడా పెద్ద చెట్టునే నాశనం చేయగలదని, చెడు సావాసం కూడా అంతేనని భావం."], ["26", "పిరికివాని మనసులో నిజంగా ఏముంటుంది?", "బింకము (డాంబికం)", "పిరికివాడు పైకి బింకంగా, గర్వంగా కనిపించినా లోన భయమే ఉంటుందని పద్య తాత్పర్యం."], ["27", "పద్యంలో కుక్క వలన భంగపడిన జలచరం ఏది?", "మొసలి", "నీటిలో బలంగా ఉండే మొసలి కూడా ఒడ్డుకు వస్తే కుక్క వలన ఓడిపోతుందని భావం."], ["28", "వేమన పద్యాల చివర వచ్చే మకుటం (ముగింపు పలుకు) ఏమిటి?", "విశ్వదాభిరామ వినురవేమ", "వేమన తన ప్రతి పద్యాన్ని ఈ మకుటంతో ముగించడం ఆయన శతక శైలి ప్రత్యేకత."], ["29", "మిరియపు గింజను కొరికితే ఎలా అనిపిస్తుంది?", "కారంగా", "పైకి చిన్నదిగా, నల్లగా కనిపించే మిరియపు గింజ రుచికి కారంగా ఉంటుందని ఉదాహరణ."], ["30", "అనేకమంది సంతానం కంటే ఒక్కడైనా ఎలాంటివాడు చాలు?", "ఉత్తమ పురుషుడు", "సంఖ్యలో ఎక్కువమంది సంతానం కంటే, ఒక్క ఉత్తముడు ఉంటే చాలని వేమన బోధన."], ["31", "తేలుకు విషం శరీరంలో ఎక్కడ ఉంటుంది?", "తోక", "పాముకు తలలో, తేలుకు తోకలో విషం ఉంటుందని వేమన తేడాను చూపాడు."], ["32", "సంపదలు సమకూరినప్పుడు వచ్చేవారు ఎవరు?", "బంధువులు", "డబ్బు ఉన్నప్పుడే బంధువులు దగ్గరవుతారనే లోకనీతిని ఈ పద్యం చెబుతుంది."], ["33", "మనిషి తన మనసులో పొందే సంతోషాన్ని దేనితో పోల్చారు?", "స్వర్గం", "మనసు శాంతంగా, సంతోషంగా ఉంటే అదే స్వర్గమని, దుఃఖమే నరకమని వేమన భావం."], ["34", "చిత్తశుద్ధి లేకుండా చేసే శివపూజ ఎలా ఉంటుంది?", "వ్యర్థం", "మనసులో శుద్ధి లేకుండా చేసే ఏ పూజైనా ఫలితం ఉండదని బోధన."], ["35", "ఈ లోకంలో నిజమైన సంపన్నుడు ఎవరు?", "అప్పులేని వాడు", "ఎంత సంపద ఉన్నా అప్పు లేని వానికే నిజమైన తృప్తి, సంపన్నత ఉంటుందని భావం."], ["36", "చదువులో మనం ముఖ్యంగా గ్రహించవలసింది ఏమిటి?", "మర్మం (అంతరార్థం)", "అక్షరాలు నేర్చుకోవడమే కాక, చదువులోని అసలు అర్థాన్ని గ్రహించాలని బోధన."], ["37", "పరమేశ్వరుని భార్య పేరు ఏమిటి?", "పార్వతి", "శివుని దేవేరి పార్వతిని ప్రస్తావిస్తూ సాగే పద్యం ఇది."], ["38", "చదువుకోని వ్యక్తి చివరికి ఎలా తయారవుతాడు?", "అజ్ఞాని", "విద్య లేకపోతే మనిషి జ్ఞానం పొందలేక అజ్ఞానిగానే మిగిలిపోతాడని భావం."], ["39", "దురలవాట్ల (వ్యసనాల) వలన ఎక్కువగా నష్టపోయేది ఏమిటి?", "ధనం", "జూదం వంటి వ్యసనాలు మనిషి సొమ్మును హరించివేస్తాయని హెచ్చరిక."], ["40", "కోపం (క్రోధం) మనిషిలోని దేనిని నాశనం చేస్తుంది?", "మంచిగుణము", "ఎంతటి మంచి గుణాలున్నా, కోపం వాటిని క్షణంలో పోగొడుతుందని బోధన."], ["41", "ఏ భాషా పద్యకవిత శాశ్వతంగా జీవిస్తుందని కవి చెప్పాడు?", "తెలుగు", "ప్రపంచంలో శబ్దార్థాలు ఉన్నంతవరకు తెలుగు పద్యకవిత సజీవంగా ఉంటుందని కవి భావన."], ["42", "తెలుగింట పండిన బంగారు పంటగా దేనిని అభివర్ణించారు?", "పద్యం", "తెలుగు పద్యాన్నే ఒక అమూల్యమైన బంగారు పంటగా కవి కొనియాడాడు."], ["43", "సగరపుత్రులకు యజ్ఞాశ్వం కనిపించిన ప్రదేశం ఏది?", "రసాతలం", "సగరపుత్రులు గుర్రం కోసం వెతుకుతూ రసాతలంలో కపిల మునిని చూసి అవమానించి శపించబడ్డారు."], ["44", "కురుక్షేత్ర యుద్ధంలో పాండవుల పక్షాన ఉన్న ద్రుపదుని కుమార్తె తండ్రి (రాజు) ఎవరు?", "ద్రుపదుడు", "శిఖండికి సమయం చిక్కి, పాండవుల పక్షాన ఉన్న ద్రుపదుడికి యుద్ధంలో సహాయం చేశాడని గద్యం."], ["45", "మద్ర దేశాధిపతి, కర్ణుడికి రథసారథ్యం వహించినవాడు ఎవరు?", "శల్యుడు", "పాండురాజు రెండవ భార్య మాద్రికి సోదరుడైన శల్యుడు మద్ర దేశాధిపతి, గొప్ప వీరుడు."], ["46", "కుంభకోణం అనే పుణ్యక్షేత్రం ఏ రాష్ట్రంలో ఉంది?", "మద్రాసు (తమిళనాడు)", "తంజావూరు జిల్లాలో కావేరి నది ఒడ్డున ఉన్న కుంభకోణం 'మహామాఘం' పుణ్యతటాకానికి ప్రసిద్ధి."], ["47", "అభిమన్యుడు పద్మవ్యూహంలో పోరాడుతుండగా, చివరికి అతన్ని చుట్టుముట్టిన కౌరవ నాయకుడు ఎవరు?", "దుర్యోధనుడు", "ద్రోణ, కృప, అశ్వత్థామ, కర్ణులు ఓడిపోతుండగా, కౌరవ వీరులంతా దుర్యోధనుని నేతృత్వంలో అభిమన్యుని చుట్టుముట్టారు."], ["48", "'వానాకాలపు చదువు' అనే జాతీయానికి అర్థం ఏమిటి?", "క్రమంగా సాగని చదువు", "వర్షాకాలంలో బడులకు తరచూ సెలవులు రావడం వల్ల చదువు క్రమం తప్పి సాగుతుందనే భావం నుండి ఈ జాతీయం వచ్చింది."], ["49", "తెల్లవారుజామున ఆకాశంలో కనిపించే చుక్కను ఏమని పిలుస్తారు?", "వేగుచుక్క", "శుక్రుడు సూర్యునికి దగ్గరగా ఉండటం వల్ల సూర్యోదయానికి ముందు కనిపిస్తాడు కనుక దీనిని వేగుచుక్క అంటారు."], ["50", "కంచిలో స్వామివారిని ఊరేగించే అతి పెద్ద వాహనం ఏది?", "గరుడ వాహనం", "కంచి గరుడసేవ కోసం చేసే గొప్ప ప్రయత్నాన్నే 'కంచి గరుడసేవ' అనే జాతీయంగా వాడుతారు."]], [["51", "ఐదు ప్రాకారాలు, నాలుగు గోపురాలు కలిగిన దక్షిణదేశ పుణ్యక్షేత్రం ఏది?", "చిదంబరం", "చిదంబరం ఆలయం ప్రాచీన శిల్పకళా వైభవానికి ప్రసిద్ధి; ఈ ఆలయ గర్భాలయానికి 'చిత్సభ' అని పేరు."], ["52", "పుట్టపర్తి నారాయణాచార్యులు 'పండరి భాగవతం' ఏ కావ్య శైలిలో రచించారు?", "ద్విపద", "ఇరవై నాలుగు వేల ద్విపదల్లో భగవత కథను భక్తిభావంతో పుట్టపర్తి వారు రచించారు."], ["53", "ఆధునిక తెలుగు కవిత్వంలో దీపస్తంభం వంటిదిగా అభివర్ణించిన రచన ఏది?", "అమృతం కురిసిన రాత్రి", "శ్రీ దేవరకొండ బాలగంగాధర తిలక్ రాసిన ఈ కావ్యం ఆధునిక కవిత్వానికి జవము, జీవము ప్రసాదించింది."], ["54", "పురాణాలు వింటున్నప్పుడు, చదివేటప్పుడు మనసుకు కలిగే భావం ఏమిటి?", "భక్తిభావం", "పురాణ శ్రవణం వల్ల మనసు భక్తిభావంతో నిండి, దానధర్మాలపై ఆసక్తి కలుగుతుందని గద్యం భావం."], ["55", "చాగంటి సోమయాజులుగారు జీవితాంతం ఏ వాదిగా జీవించారు?", "అభ్యుదయవాది", "అభ్యుదయ రచయితల సంఘంలో సభ్యులైన చాసో జీవితాంతం అభ్యుదయవాదిగా జీవించారు."], ["56", "ఆంధ్రదేశంలో జరిగిన ఏ ఉద్యమంలో మల్లాది సుబ్బమ్మ చురుకుగా పాల్గొన్నారు?", "సారా వ్యతిరేక ఉద్యమం", "సారాను నిషేధించే వరకు విశ్రమించని ధీరురాలిగా మల్లాది సుబ్బమ్మ ఈ ఉద్యమంలో పనిచేశారు."], ["57", "భారత ప్రభుత్వం దేవులపల్లి కృష్ణశాస్త్రిని ఏ బిరుదుతో సత్కరించింది?", "పద్మవిభూషణ్", "ఆంధ్రా షెల్లీగా ప్రసిద్ధులైన కృష్ణశాస్త్రిని భారత ప్రభుత్వం పద్మవిభూషణ్‌తో గౌరవించింది."], ["58", "శివుని లింగాకృతిలో మొదటి భాగం చూశానని అబద్ధం చెప్పి శపించబడినవాడు ఎవరు?", "బ్రహ్మ", "అబద్ధం చెప్పినందుకు శివుడు బ్రహ్మ ఐదో తలను నరికివేయగా, బ్రహ్మకపాలం ఏర్పడిందని కథ."], ["59", "రావణుడు కుబేరుని రాజధాని అయిన ఏ ప్రాంతంపై దండెత్తాడు?", "అలకాపురి", "కుబేరుని సైన్యం రావణుని ధాటికి నిలువలేకపోగా, స్వయంగా కుబేరుడే యుద్ధరంగానికి వచ్చాడు."], ["60", "తిన్నడు వేటాడి అలసిపోయి ఏ చెట్టు కింద నిద్రపోయాడు?", "పొగడ చెట్టు", "బోయపల్లె ప్రాంతానికి చెందిన తిన్నడు వేటాడిన తర్వాత పొగడ చెట్టు కింద నిద్రించాడు."], ["61", "కురుక్షేత్ర యుద్ధంలో విజయం సాధించిన ధర్మరాజు ఏ రాజ్యాన్ని పాలించాడు?", "హస్తినాపురం", "ధర్మరాజు హస్తినాపుర రాజ్యపాలన సాగించి, తరువాత మహాప్రస్థానానికి బయలుదేరాడు."], ["62", "ప్రకృతి రహస్యాలను వివరించలేనిది శాస్త్రం కాదని భావించిన కొడవటిగంటి కుటుంబరావు ఏ రంగానికి చెందినవారు?", "సాహిత్యం", "13 సంవత్సరాల వయసులోనే రచనకు శ్రీకారం చుట్టిన కొడవటిగంటి గొప్ప సాహితీవేత్త."], ["63", "శత్రువులు దండెత్తి వచ్చినప్పుడు యుద్ధాన్ని ఎదుర్కొనే వాడిని ఏమంటారు?", "యోధుడు", "శత్రు దండయాత్రను ధైర్యంగా ఎదుర్కొనేవాడిని యోధుడని పిలుస్తారని గద్యం వివరిస్తుంది."], ["64", "సగరపుత్రులు తపస్సు చేసుకుంటున్న ఏ మునిని అవమానించారు?", "కపిలుడు", "గుర్రం కోసం వెతుకుతూ రసాతలంలో కపిలుని చూసి, దొంగ అనుకొని అవమానించడంతో సగరపుత్రులు కాలి భస్మమయ్యారు."], ["65", "భీష్ముడిపై పగ తీర్చుకోవాలని ఎదురుచూసినది ఎవరు?", "శిఖండి", "కౌరవ-పాండవ యుద్ధంలో సమయం చిక్కగానే శిఖండి భీష్ముని మీద పగ తీర్చుకున్నాడు."], ["66", "మద్ర దేశాధిపతి శల్యుడు యుద్ధంలో ఎవరికి రథసారథ్యం వహించాడు?", "కర్ణుడు", "రథం నడపడంలో నిపుణుడైన శల్యుడు కర్ణుడికి రథసారథ్యం చేశాడని గద్యం."], ["67", "కుంభకోణం పుణ్యక్షేత్రం ఏ నది ఒడ్డున ఉంది?", "కావేరి నది", "తంజావూరు జిల్లాలో కావేరి నది ఒడ్డున ఉన్న కుంభకోణం 'మహామాఘం' పుణ్యతటాకానికి ప్రసిద్ధి."], ["68", "అభిమన్యుడు ఏ వ్యూహంలో చిక్కుకుపోయాడు?", "పద్మవ్యూహం", "పద్మవ్యూహాన్ని ఛేదించుకుని వెళ్లిన బాలుడైన అభిమన్యుడు కౌరవ మహావీరులతో వీరోచితంగా పోరాడాడు."], ["69", "'వానాకాలపు చదువు' అనే జాతీయం ఏ కాలానికి సంబంధించినది?", "వర్షాకాలం", "వర్షాకాలంలో బడులకు తరచూ సెలవులు రావడం వల్ల చదువు క్రమం తప్పి సాగడం నుండి ఈ జాతీయం వచ్చింది."], ["70", "సూర్యునికి బాగా దగ్గరగా ఉండటం వల్ల వేగుచుక్కగా కనిపించే గ్రహం ఏది?", "శుక్రుడు", "శుక్రుడు ఎప్పుడూ సూర్యుడికి దగ్గరగా ఉంటాడు కనుక ఆకాశం మధ్యలో కనిపించడు, వేకువజామున మాత్రమే కనిపిస్తాడు."], ["71", "అతిపెద్ద గరుడాళ్వారు విగ్రహం ఏ పుణ్యక్షేత్రంలో ఉంది?", "కంచి", "కంచిలోని గరుడాళ్వారు విగ్రహం చాలా పెద్దది; దీనిని ఊరేగించడం గొప్ప ప్రయత్నంతో కూడుకున్నది."], ["72", "చిదంబరం ఆలయానికి ఎన్ని గోపురాలు ఉన్నాయి?", "నాలుగు", "ఐదు ప్రాకారాలు, నాలుగు గోపురాలతో చిదంబరం ఆలయం ప్రాచీన శిల్పకళా వైభవాన్ని చాటుతుంది."], ["73", "పుట్టపర్తి వారి రచన కానిది ఏది?", "రామాయణ కల్పవృక్షం", "మేఘదూతం, సాక్షాత్కారం, పండరి భాగవతం, జనప్రియ రామాయణం పుట్టపర్తి రచనలు; రామాయణ కల్పవృక్షం విశ్వనాథ సత్యనారాయణ రచన."], ["74", "భావకవితా యుగానికి చివరి గొప్ప ప్రతినిధిగా చెప్పబడినవారు ఎవరు?", "దేవరకొండ బాలగంగాధర తిలక్", "కృష్ణశాస్త్రి భావనాశక్తి, శ్రీశ్రీ అభ్యుదయ రక్తి తిలక్ కవితలో కలగలిసి కనిపిస్తాయని గద్యం."], ["75", "వేటిని వింటున్నప్పుడు భక్తిభావం కలుగుతుందని గద్యం చెబుతుంది?", "పురాణాలు", "పురాణాలు వినడం వల్ల తాత్కాలిక వైరాగ్యం కలిగి, భక్తి భావం పొందుతారని భావం."], ["76", "చాగంటి సోమయాజులు మరణానంతరం తన శరీరాన్ని దేనికి వినియోగించాలని ఆశించారు?", "వైద్యశాస్త్ర పరిశోధనలకు", "కుటుంబసభ్యులు ఆయన ఆకాంక్షను గౌరవించి చెన్నైలోని వైద్యకళాశాలకు పార్థివదేహాన్ని అందజేశారు."], ["77", "'నేను ఫెమినిస్టుని, హ్యూమనిస్టు ఫెమినిస్టుని' అని ప్రకటించుకున్న రచయిత్రి ఎవరు?", "మల్లాది సుబ్బమ్మ", "తన స్థిరాస్తులను పిల్లలకు కాకుండా ట్రస్టుకు రాసి సామాజిక సేవకు అంకితం చేసిన ధీరురాలు."], ["78", "దేవులపల్లి కృష్ణశాస్త్రి తల్లిదండ్రులు ఎవరు?", "సీతమ్మ - తమ్మన్న శాస్త్రి", "తూర్పుగోదావరి జిల్లా పిఠాపురం దగ్గర రామచంద్రాపురంలో జన్మించిన కృష్ణశాస్త్రి తల్లిదండ్రులు వీరు."], ["79", "చతుర్ముఖుడైన బ్రహ్మను శపించి ఐదో తలను నరికినవాడు ఎవరు?", "శివుడు", "బ్రహ్మ అబద్ధం చెప్పినందుకు శివుడు అతని ఐదో తలను నరికి, బ్రహ్మకపాలంతోనే భిక్షాటన చేసేలా శపించాడు."], ["80", "బలగర్విష్టుడైన రావణుడు వీరిచేత వరాలు పొంది జైత్రయాత్రలు చేశాడు?", "బ్రహ్మ", "బ్రహ్మచేత వరాలు పొందిన రావణుడు గంధర్వులు, కిన్నరులు, సిద్ధులను దండెత్తి బాధించాడు."], ["81", "వేటగాడైన తిన్నడి తల్లిదండ్రులు ఎవరు?", "నాథనాథులు", "బహుదా నది ఒడ్డున ఉదుమూరు అనే బోయపల్లెలో నివసించిన నాథనాథులకు జన్మించిన కొడుకు తిన్నడు."], ["82", "మహాప్రస్థానానికి వెళ్లేటప్పుడు ధర్మరాజు రాజ్యాన్ని ఎవరికి అప్పగించాడు?", "పరీక్షిత్తు", "పరీక్షిత్తుకు పట్టం కట్టి, తమ్ములతో కలిసి ధర్మరాజు మహాప్రస్థానానికి బయలుదేరాడు."], ["83", "ప్రకృతి రహస్యాలను వివరించలేనిది శాస్త్రం కాదని కొడవటిగంటి కుటుంబరావు దేనిని భావించారు?", "శాస్త్రం", "శాస్త్రం ప్రకృతి రహస్యాలను, ఆవిష్కారం ప్రజల కష్టాలను పూర్తిగా తీర్చలేదని ఆయన అభిప్రాయం."], ["84", "అబద్ధాలు ఆడని వారిని ఏమని పిలుస్తారు?", "యోగ్యుడు", "దశరథరామునిగా అబద్ధమాడని వాడే యోగ్యుడని, యుద్ధమును ఎదుర్కొనేవాడు యోధుడని పద్యం భావం."], ["85", "'మంచిబాలుడు' పాఠ్యభాగ రచయిత ఎవరు?", "ఆలూరి బైరాగి", "బాల్య విశేషాలతో కూడిన ఈ పాఠ్యభాగాన్ని ఆలూరి బైరాగి రచించారు."], ["86", "'పేక్ నాజర్' బాల్యవిశేషాలు ఉన్న పాఠ్యాంశం ఏది?", "నా బాల్యం", "బాల్యంలోని ఆటలు, అనుభవాలను వివరించే ఈ పాఠ్యాంశంలో పేక్ నాజర్ ప్రస్తావన ఉంది."], ["87", "'మావూరి పేరు' పాఠ్యభాగాన్ని రచించినది ఎవరు?", "పాలగుమ్మి విశ్వనాథం", "గ్రామీణ జీవన చిత్రణతో కూడిన ఈ పాఠ్యభాగాన్ని పాలగుమ్మి విశ్వనాథం రచించారు."], ["88", "'సత్యమహిమ' పాఠ్యభాగ రచయిత ఎవరు?", "అవధాని రమేష్", "నీతిని బోధించే ఈ పాఠ్యభాగాన్ని అవధాని రమేష్ రచించారు."], ["89", "గురజాడ అప్పారావు రచించిన గొప్ప నాటకం ఏది?", "కన్యాశుల్కం", "సాంఘిక దురాచారాలపై విమర్శనాత్మకంగా రాసిన కన్యాశుల్కం తెలుగు నాటక రంగంలో మేలిమలుపు."], ["90", "గుర్రం జాషువా రచనల నుండి సేకరించిన పాఠ్యభాగం ఏది?", "రాజు - కవి", "జాషువా గారి సాంఘిక చైతన్యాన్ని ప్రతిబింబించే ఈ పాఠ్యభాగం రాజు-కవి రచనల నుండి సేకరించబడింది."], ["91", "'అభినవ నన్నయ' బిరుదు గల కవి ఎవరు?", "రాయప్రోలు సుబ్బారావు", "భావకవిత్వ పితామహుడిగా పేరొందిన రాయప్రోలు సుబ్బారావుకు ఈ బిరుదు ఉంది."], ["92", "'పాలేరు నుండి పద్మశ్రీ వరకు' అనే స్వీయ చరిత్ర ఎవరిది?", "ఏడిద కామేశ్వరరావు", "జీవితంలో ఎదిగి వచ్చిన అనుభవాలను వివరిస్తూ ఏడిద కామేశ్వరరావు ఈ స్వీయచరిత్రను రాశారు."], ["93", "'సవర వాచకాలు' రూపొందించినవారు ఎవరు?", "రాయప్రోలు సుబ్బారావు", "గిరిజన భాషలో విద్యాబోధన కోసం రాయప్రోలు సుబ్బారావు ఈ వాచకాలను రూపొందించారు."], ["94", "'బాలబంధు'గా ప్రసిద్ధి చెందిన కవి ఎవరు?", "బాడిగ వెంకట నరసింహారావు", "బాలసాహిత్యానికి విశేష సేవలందించిన కవిగా ఈయన బాలబంధుగా పేరుపొందారు."], ["95", "'దండాలు దండాలు భారతమాత' గేయాన్ని రచించిన కవి ఎవరు?", "గరిమెళ్ళ సత్యనారాయణ", "స్వాతంత్ర్య ఉద్యమ స్ఫూర్తినిచ్చే ఈ గేయాన్ని గరిమెళ్ళ సత్యనారాయణ రచించారు."], ["96", "'గద్యతిక్కన'గా బిరుదు పొందినవారు ఎవరు?", "కందుకూరి వీరేశలింగం", "గద్య రచనలో తిక్కనతో సమానమైన నైపుణ్యం చూపారని కందుకూరి వీరేశలింగానికి ఈ బిరుదు వచ్చింది."], ["97", "'తెలుగు బాల శతకం' రచించిన కవి ఎవరు?", "కరుణశ్రీ", "పిల్లలకు నీతిని బోధించే ఈ శతకాన్ని కరుణశ్రీ జంధ్యాల పాపయ్యశాస్త్రి రచించారు."], ["98", "'మాయాకంబళి' పాఠ్యభాగ రచయిత ఎవరు?", "కలువకొలను సదానంద", "ఊహాశక్తిని రేకెత్తించే ఈ పాఠ్యభాగాన్ని కలువకొలను సదానంద రచించారు."], ["99", "'పదకవితా పితామహుడు' అనే బిరుదు గల వాగ్గేయకారుడు ఎవరు?", "అన్నమయ్య", "వేలాది సంకీర్తనలు రచించిన తాళ్లపాక అన్నమాచార్యులకు ఈ బిరుదు ఉంది."], ["100", "మారద వెంకయ్య, గువ్వల చెన్నుడు, పోతన, ఏనుగు లక్ష్మణ కవుల శతక/కావ్య రచనలు వరుసగా ఏవి?", "భాస్కర శతకము, గువ్వలచెన్న శతకము, భాగవతము, సుభాషిత రత్నావళి", "ఒక్కొక్క కవి ఒక్కో ప్రసిద్ధ రచన చేశారు: మారద వెంకయ్య-భాస్కర శతకం, గువ్వల చెన్నుడు-గువ్వలచెన్న శతకం, పోతన-భాగవతం, ఏనుగు లక్ష్మణకవి-సుభాషిత రత్నావళి."]], [["101", "'కవిసార్వభౌముడు' అనే బిరుదు కలిగిన ప్రాచీన కవి ఎవరు?", "శ్రీనాథుడు", "రాజాస్థానాలలో సత్కరింపబడిన శ్రీనాథుడికి 'కవిసార్వభౌముడు' అనే బిరుదు ఉంది."], ["102", "'బారిస్టర్ పార్వతీశం' నవల రచయిత ఎవరు?", "మొక్కపాటి నరసింహశాస్త్రి", "హాస్యరస ప్రధానమైన ఈ ప్రసిద్ధ నవలను మొక్కపాటి నరసింహశాస్త్రి రచించారు."], ["103", "'నా యాత్ర' పాఠ్యభాగ రచయిత ఎవరు?", "గుర్రం జాషువా", "తన అనుభవాలను వివరిస్తూ గుర్రం జాషువా ఈ రచన చేశారు."], ["104", "'నవయుగ కవిచక్రవర్తి', 'మధుర శ్రీనాథ' బిరుదులు కలిగిన ఆధునిక కవి ఎవరు?", "గుర్రం జాషువా", "సాంఘిక చైతన్యంతో కూడిన రచనలు చేసిన జాషువాకు ఈ బిరుదులు లభించాయి."], ["105", "'కవిబ్రహ్మ', 'ఉభయకవిమిత్రుడు' అనే బిరుదులు కలిగిన కవి ఎవరు?", "తిక్కన", "మహాభారతంలో ఉత్తర భాగాన్ని రచించిన తిక్కనకు ఈ బిరుదులు ప్రసిద్ధి."], ["106", "'తిమిరంలో సమరం' కావ్యాన్ని రచించిన కవి ఎవరు?", "ఆలూరి బైరాగి", "అస్తిత్వవాద ధోరణిలో సాగే కవితలకు ప్రసిద్ధులైన ఆలూరి బైరాగి రచన ఇది."], ["107", "'ఏకాదశి' కావ్యాన్ని రచించిన కవి ఎవరు?", "చింతా దీక్షితులు", "ఆధునిక తెలుగు కవిత్వంలో ప్రత్యేక శైలిగల చింతా దీక్షితులు ఈ కావ్యాన్ని రచించారు."], ["108", "'నూతిలో గొంతుకలు' కావ్యాన్ని రచించినవారు ఎవరు?", "ఆలూరి బైరాగి", "ఆధునిక తెలుగు కవిత్వంలో అస్తిత్వవాద భావనలకు మార్గదర్శకమైన కావ్యం ఇది."], ["109", "గోర్కీ కథలను తెలుగులోకి అనువదించిన తెలుగు కవి ఎవరు?", "త్రిపురనేని రామస్వామి చౌదరి", "రష్యన్ సాహిత్యాన్ని తెలుగు పాఠకులకు పరిచయం చేసిన ప్రయత్నాల్లో ఇది ఒకటి."], ["110", "'బిరుదురాజు రామరాజు' గారి రచన ఏది?", "జానపద గేయగాథలు", "జానపద సాహిత్య పరిశోధనలో ప్రసిద్ధులైన బిరుదురాజు రామరాజు ఈ గ్రంథాన్ని రచించారు."], ["111", "కింది వానిలో త్రిపురనేని రామస్వామి రచించిన కావ్యం ఏది?", "సూతపురాణం", "సాంఘిక సంస్కరణ దృక్పథంతో రాసిన ఈ రచన ఆయనకు ప్రసిద్ధి తెచ్చింది."], ["112", "'బాలకవి శరణ్యం' గ్రంథాన్ని రచించిన కవి ఎవరు?", "చిన్నయసూరి", "వ్యాకరణ, నీతి గ్రంథాలతో ప్రసిద్ధులైన చిన్నయసూరి రచనల్లో ఇది ఒకటి."], ["113", "'ధర్మదీక్ష'ను రచించిన కవి ఎవరు?", "జంధ్యాల పాపయ్యశాస్త్రి", "నీతి, ధర్మ భావనలతో కూడిన కవిత్వానికి ప్రసిద్ధులైన కరుణశ్రీ (జంధ్యాల పాపయ్యశాస్త్రి) రచన ఇది."], ["114", "రాయలసీమ సౌందర్యాన్ని, విషాదాన్ని సమంగా చిత్రించిన కవి ఎవరు?", "విద్వాన్ విశ్వం", "'పెన్నేటి పాట' ద్వారా రాయలసీమ ప్రకృతిని, జీవన విషాదాన్ని విద్వాన్ విశ్వం అద్భుతంగా చిత్రించారు."], ["115", "రావూరి భరద్వాజ రచించిన ఏ రచనకు జ్ఞానపీఠ పురస్కారం లభించింది?", "పాకుడురాళ్ళు", "తెలుగు సాహిత్యానికి జ్ఞానపీఠ పురస్కారం తెచ్చిన నవలలలో పాకుడురాళ్ళు ఒకటి."], ["116", "'బిడ్డల శిక్షణ' అనే పుస్తకాన్ని రచించినవారు ఎవరు?", "రావూరి భరద్వాజ", "విద్యా, శిక్షణ అంశాలపై రావూరి భరద్వాజ ఈ రచన చేశారు."], ["117", "'రాజశేఖర చరిత్రము' వీరి రచన?", "కందుకూరి వీరేశలింగం", "తెలుగులో తొలి నవలగా పరిగణించే ఈ రచనను కందుకూరి వీరేశలింగం రచించారు."], ["118", "రామాయణాన్ని సరళంగా ద్విపదలతో రాసిన కవయిత్రి ఎవరు?", "మొల్ల", "సామాన్య పాఠకులకు కూడా అర్థమయ్యేలా సరళ శైలిలో మొల్ల రామాయణాన్ని రచించింది."], ["119", "'పల్నాటి వీరచరిత్ర' కావ్యాన్ని రచించిన కవి ఎవరు?", "శ్రీనాథుడు", "పల్నాటి వీరుల చరిత్రను కావ్యరూపంలో శ్రీనాథుడు రచించారని ప్రతీతి."], ["120", "'సారస్వతలోకము'ను రచించినవారు ఎవరు?", "రాళ్ళపల్లి అనంతకృష్ణశర్మ", "సాహిత్య విమర్శ, పరిశోధనలలో ప్రసిద్ధులైన రాళ్ళపల్లి వారి రచన ఇది."], ["121", "'హితోక్తి శతకం' రచించిన శతక కవి ఎవరు?", "పక్కి అప్పలనరసయ్య", "నీతి పద్యాలతో కూడిన ఈ శతకాన్ని పక్కి అప్పలనరసయ్య రచించారు."], ["122", "'పండిత పరమేశ్వర శాస్త్రి వీలునామా'ను రచించిన ఆధునిక కవి ఎవరు?", "రాళ్ళపల్లి అనంతకృష్ణశర్మ", "వ్యంగ్య, హాస్య ధోరణిలో సాగే ఈ రచన ఆధునిక సాహిత్యంలో ప్రత్యేకత సంతరించుకుంది."], ["123", "'శతావధాన ప్రబంధం త్రిపుటి' అనే గ్రంథాన్ని రచించినవారు ఎవరు?", "మామిడిపూడి వెంకటరంగయ్య", "అవధాన విద్యకు సంబంధించిన ఈ గ్రంథాన్ని మామిడిపూడి వెంకటరంగయ్య రచించారు."], ["124", "'హిందూమహా సముద్రం' వీరి రచన?", "వెలమల సిమ్మన్న", "సముద్ర ప్రయాణ అనుభవాలతో కూడిన ఈ రచనను వెలమల సిమ్మన్న రాశారు."], ["125", "'మారుతున్న సమాజం - నా జ్ఞాపకాలు' పేరుతో ఆత్మకథను రాసినవారు ఎవరు?", "ఆచార్య మామిడిపూడి వెంకట రంగయ్య", "సామాజిక మార్పులను తన అనుభవాల ద్వారా ఈ ఆత్మకథలో వివరించారు."], ["126", "సింగమనేని నారాయణ రచన కానిది ఏది?", "జూదం", "సీమకథలు, అనంతం, కృష్ణపక్షం వంటివి ఆయన రచనలు అయినప్పటికీ, జూదం వాటిలో లేదు."], ["127", "పొదుపు కథలతో కూడుకొన్న పాఠం ఏది?", "పొదుపు - విడుపు", "పొదుపు, ఖర్చు మధ్య సమతూకాన్ని బోధించే కథలు ఈ పాఠంలో ఉన్నాయి."], ["128", "'తెలుగు తల్లి' పాఠానికి ఈ మాసపు పాట ఏది?", "తల్లీ తెలుగుతల్లి", "తెలుగు భాష, సంస్కృతిని కొనియాడుతూ సాగే ప్రార్థనా గీతం ఇది."], ["129", "బలం ఉన్నవాడి కంటే కూడా ఎక్కువ బలవంతుడు ఎవరు అని పద్యం చెబుతుంది?", "మొండివాడు", "'మొండివాడు రాజు కన్నా బలవంతుడు' అనే లోకోక్తిని ఈ పాఠం వివరిస్తుంది."], ["130", "గొడ్డలి పోగొట్టుకున్నవాడికి కనిపించిన దేవత ఎవరు?", "నదీదేవత", "నీటిలో పడిన గొడ్డలిని వెతుకుతుండగా నదీదేవత ప్రత్యక్షమైందని కథ చెబుతుంది."], ["131", "'దేశమును ప్రేమించుమన్నా' గేయంలో కట్టిపెట్టమన్నవి ఏమిటి?", "వొట్టి మాటలు", "వట్టి మాటలు మాని గట్టి మేలు చేయమని గురజాడ ఈ గేయంలో పిలుపునిచ్చారు."], ["132", "సంక్రాంతి సమయంలో సాధారణంగా కనిపించనిది ఏది?", "టపాకాయలు", "ముగ్గులు, భోగిమంటలు, గంగిరెద్దులు సంక్రాంతి ప్రత్యేకతలైతే, టపాకాయలు ఎక్కువగా దీపావళికి సంబంధించినవి."], ["133", "జన్మభూమిని కీర్తిస్తూ రాయప్రోలు సుబ్బారావు రాసిన గేయం ఏది?", "ఏ దేశమేగినా", "దేశమాత గొప్పదనాన్ని, జాతి గౌరవాన్ని చాటిచెప్పే ప్రసిద్ధ గేయమిది."], ["134", "పక్షులపై ప్రేమను చూపడం అనే విషయం ఉన్న పాఠ్యభాగం ఏది?", "మంచి బహుమతి", "పక్షుల పట్ల కరుణ, ప్రేమను చూపించే కథ ఈ పాఠంలో ఉంది."], ["135", "కింది వాటిలో జానపద కళ ఏది?", "తోలుబొమ్మలాట", "గ్రామీణ ప్రాంతాల్లో ప్రాచుర్యం పొందిన ఈ కళారూపం జానపద కళగా పరిగణించబడుతుంది."], ["136", "'తృప్తి' పాఠంలో ఇతరులకు రుచికరమైన ఆహారం పెట్టి ఆనందించినది ఎవరు?", "పూర్ణయ్య", "ఇతరులకు తృప్తిగా భోజనం పెట్టడంలో ఆనందాన్ని పొందిన పాత్ర ఇది."], ["137", "'రాజద్రోహం అంతా రాట్నంలో ఉంది' అని అన్నది ఎవరు?", "తెల్లవారు", "గాంధీజీ రాట్నాన్ని స్వాతంత్ర్య పోరాట చిహ్నంగా చూసిన బ్రిటిష్ పాలకులు ఈ మాట అన్నారు."], ["138", "'సమయస్ఫూర్తి' పాఠంలో ప్రధాన పాత్ర ఏది?", "ఫలితుడు", "సమయస్ఫూర్తితో ప్రమాదం నుండి తప్పించుకున్న పాత్ర పేరు ఫలితుడు."], ["139", "ఆంధ్రరాష్ట్రం కోసం ప్రాణత్యాగం చేసిన పొట్టి శ్రీరాములు గారు నిరాహారదీక్ష ఎక్కడ చేశారు?", "మద్రాసు", "ప్రత్యేక ఆంధ్రరాష్ట్ర సాధన కోసం పొట్టి శ్రీరాములు మద్రాసులో ఆమరణ దీక్ష చేశారు."], ["140", "'ప్రియ మిత్రునికి' పాఠంలో మానవుని ముఖకృతి దేనికి ప్రతిబింబం అన్నారు?", "మనసుకు", "మనిషి మనసులోని భావాలే ముఖంలో ప్రతిఫలిస్తాయని ఈ పాఠం తెలియజేస్తుంది."], ["141", "'స్ఫూర్తి ప్రదాతలు' పాఠంలో వెల్లూరు సెంట్రల్ జైలులో శిక్ష అనుభవించిన స్వాతంత్ర్య సమరయోధుడు ఎవరు?", "గాడిచర్ల హరిసర్వోత్తమరావు", "పత్రికా రచనల ద్వారా బ్రిటిష్ పాలనను ప్రశ్నించినందుకు ఆయన జైలుశిక్ష అనుభవించారు."], ["142", "నరసరావుపేట సమీపంలో ఉన్న ప్రసిద్ధ శైవక్షేత్రం ఏది?", "కోటప్పకొండ", "త్రికోటేశ్వరస్వామి ఆలయంతో ప్రసిద్ధి చెందిన కోటప్పకొండ ఈ ప్రాంతానికి దగ్గరగా ఉంది."], ["143", "పాఠంలో 'పరి' అనగా ఏమిటి?", "గుర్రం", "పాఠంలో వాడిన ఈ పదానికి గుర్రం అని అర్థం చెప్పబడింది."], ["144", "వీరబ్రహ్మం బనగానపల్లెలో వీరింట్లో పశువుల కాపరిగా పనిచేసిన వారు ఎవరు?", "గరిమిరెడ్డి అచ్చమ్మ", "చిన్నతనంలో వీరబ్రహ్మేంద్రస్వామి గరిమిరెడ్డి అచ్చమ్మ ఇంట పశువులు కాచేవారని కథనం."], ["145", "నేదునూరి గంగాధరం ఉపాధ్యాయుడిగా పనిచేస్తూ దేనిని సేకరించారు?", "జానపద వాజ్ఞ్మయాన్ని", "ఉపాధ్యాయ వృత్తిలో ఉంటూనే ఆయన జానపద సాహిత్యాన్ని విస్తృతంగా సేకరించారు."], ["146", "దేవదాసీలు ఆలయాలలో ప్రదర్శించిన నాట్యం ఏది?", "భరతనాట్యం", "ఆలయ సంప్రదాయంలో భాగంగా దేవదాసీలు భరతనాట్యాన్ని ప్రదర్శించేవారు."], ["147", "భాంగ్రా నృత్యం అనేది ఎవరి వీర నృత్యం?", "రైతులు", "పంజాబీ రైతులు పంట కోతల సంబరంగా చేసే నృత్యమే భాంగ్రా."], ["148", "'పరమానందయ్య శిష్యులు' అతిథులను గౌరవించిన విధానం ఉన్న పాఠ్యాంశం ఏది?", "మర్యాద చేద్దాం", "అతిథి మర్యాదల ప్రాముఖ్యతను తెలియజేసే హాస్యభరిత కథ ఇది."], ["149", "సైనికుల సేవలను గుర్తించి దేశసేవకు పూనుకోవాలని తెలిపే ఉద్దేశంతో ఉన్న పాఠం ఏది?", "మాతృభూమి", "సైనికుల త్యాగాన్ని స్మరిస్తూ దేశభక్తిని పెంపొందించే పాఠమిది."], ["150", "'మేకపిల్ల చేసే ప్రయాణం' ఉన్న పాఠ్యభాగం ఏది?", "మే మే మేకపిల్ల", "ఒక చిన్న మేకపిల్ల ప్రయాణాన్ని వర్ణించే ఈ పాఠం పిల్లలకు ఆసక్తికరంగా ఉంటుంది."]], [["151", "రాము మనసు మంచివైపుకు మళ్ళిన కథ ఉన్న పాఠం ఏది?", "పరివర్తన", "మనిషిలో వచ్చే మానసిక మార్పును తెలిపే కథ ఇది."], ["152", "మనిషి ఎల్లప్పుడూ నిజాయితీగా జీవించాలని తెలిపే పాఠం ఏది?", "సత్యమహిమ", "సత్యం పాటించడం వల్ల కలిగే మేలును ఈ పాఠం వివరిస్తుంది."], ["153", "రాము బడికి వెళ్ళకుండా 'ఆడుకుందాం రమ్మని' ఎవరిని పిలువలేదు?", "తేనెటీగను", "శ్రమజీవి అయిన తేనెటీగ ఎప్పుడూ పనిలో నిమగ్నమై ఉంటుందని గ్రహించి రాము దాన్ని పిలువలేదు."], ["154", "'బహుమతి' పాఠం ఉద్దేశం ఏమిటి?", "తల్లిదండ్రులను గౌరవించడం", "పిల్లలు తల్లిదండ్రులను ఎలా గౌరవించాలో ఈ పాఠం బోధిస్తుంది."], ["155", "గిరిజనుల ఆచారవ్యవహారాలను తెలిపే పాఠం ఏది?", "ఇటిజ్ పండుగ", "గిరిజన సంస్కృతిలో భాగమైన ఈ పండుగను వివరిస్తూ సాగే పాఠం ఇది."], ["156", "ఇటిజ్ పండుగలో దేవునికి పెట్టే నైవేద్యం ఏమిటి?", "రొడ్డకనుసు", "గిరిజన సంప్రదాయం ప్రకారం పండుగ సందర్భంగా ఈ ప్రత్యేక నైవేద్యాన్ని (రొడ్డకనుసు) సమర్పిస్తారు."], ["157", "అమ్మప్రేమ గొప్పతనాన్ని తెలిపే పాఠ్యభాగం ఏది?", "అమ్మఒడి", "తల్లి ప్రేమ, త్యాగాన్ని హృద్యంగా వర్ణించే పాఠం ఇది."], ["158", "పంచతంత్ర కథలను మొదట ఏ భాషలో రచించారు?", "సంస్కృతం", "విష్ణుశర్మ రచించిన పంచతంత్రం మూలంగా సంస్కృత భాషలో వెలువడింది."], ["159", "విద్యార్థులలో నైతిక విలువలు పెంపొందించి, ఉత్తమ పౌరులుగా తీర్చిదిద్దడం ఏ పాఠం ఉద్దేశం?", "ధర్మనిర్ణయం", "సరైన నిర్ణయం తీసుకోవడంలోని నైతిక విలువలను ఈ పాఠం తెలియజేస్తుంది."], ["160", "మాతృభాషపై అభిమానాన్ని పెంపొందించేలా రూపొందించిన పాఠం ఏది?", "మమకారం", "అమ్మ, కుటుంబ సభ్యుల పట్ల మమకారంతో పాటు మాతృభాషపై అభిమానాన్ని పెంచే విధంగా ఈ పాఠం ఉంటుంది."], ["161", "వర్షాలు పడనప్పుడు భారతీయులు అనుసరించే ఆచారవ్యవహారాలను తెలిపే పాఠం ఏది?", "కప్పతల్లి పెళ్ళి", "వర్షం కోసం చేసే ఈ సంప్రదాయ వేడుకను వివరించే పాఠం ఇది."], ["162", "పర్యావరణ మార్పులు, గిరిజనుల జీవితం గురించి తెలిపిన పాఠం ఏది?", "మాయాకంబళి", "గిరిజన జీవన విధానంపై పర్యావరణ మార్పుల ప్రభావాన్ని ఈ పాఠం చిత్రిస్తుంది."], ["163", "సాహిత్య విలువలున్న లేఖ కలిగిన పాఠ్యాంశం ఏది?", "ప్రియమిత్రునికి", "స్నేహితునికి రాసిన లేఖ రూపంలో సాహిత్య విలువలతో కూడిన పాఠం ఇది."], ["164", "అన్నమయ్య బాలకృష్ణుని బాల్యాన్ని ఊహించి వర్ణించిన పాఠం ఏది?", "చిన్ని శిశువు", "బాల కృష్ణుని ముద్దులొలికే బాల్యాన్ని అన్నమయ్య ఈ కీర్తనలో వర్ణించారు."], ["165", "'ఆంధ్రవైభవం' పాఠ్యభాగం ప్రధాన ఉద్దేశం ఏమిటి?", "పైవన్నీ", "ఆంధ్ర చరిత్ర, కవుల ఘనత, మహనీయుల సేవలు - అన్నింటినీ ఈ పాఠం తెలియజేస్తుంది."], ["166", "'నా యాత్ర' పాఠ్యభాగం ద్వారా గ్రహించవలసిన ప్రధాన విషయం ఏమిటి?", "చారిత్రక కట్టడాలను రక్షించుకోవలసిన అవసరం", "పర్యటనలో భాగంగా చారిత్రక సంపదను కాపాడుకోవాల్సిన బాధ్యతను ఈ పాఠం తెలియజేస్తుంది."], ["167", "దేశాభివృద్ధిలో శ్రమజీవుల పాత్ర కీలకమైనదని తెలిపే పాఠం ఏది?", "దేశభక్తి", "శ్రమజీవుల కృషి దేశ ప్రగతికి పునాది అని ఈ పాఠం వివరిస్తుంది."], ["168", "'నాటి చదువు' పాఠ్యభాగంలో తెలియజేయబడిన ప్రధానాంశం ఏమిటి?", "నాటి విద్యావిధానం", "పాత కాలంనాటి విద్యావిధానాన్ని, గురుకుల సంప్రదాయాన్ని ఈ పాఠం వివరిస్తుంది."], ["169", "'తల్లీ భారతి వందనము' పాఠ్యభాగ ప్రక్రియ ఏమిటి?", "గేయం", "మాతృదేశాన్ని కొనియాడుతూ సాగే గేయరూప రచన ఇది."], ["170", "సంభాషణ ప్రక్రియకు చెందిన పాఠం ఏది?", "మా ఊరి పేరు", "పాత్రల మధ్య సంభాషణల రూపంలో సాగే పాఠం ఇది."], ["171", "'మా ఊరి పేరు' పాఠ్యభాగం ఏ ప్రక్రియకు చెందినది?", "కథానిక", "చిన్న కథ రూపంలో సాగే ఈ పాఠం కథానిక ప్రక్రియకు చెందినది."], ["172", "'దేశమును ప్రేమించుమన్నా' పాఠం ఏ ప్రక్రియకు చెందినది?", "గేయం", "గురజాడ రచించిన ఈ దేశభక్తి గీతం గేయ ప్రక్రియకు చెందినది."], ["173", "'పరివర్తన' పాఠ్యభాగం ఏ ప్రక్రియకు చెందినది?", "కథ", "మనిషి మనసులో వచ్చే మార్పును తెలిపే ఈ రచన కథా ప్రక్రియకు చెందినది."], ["174", "బసవరాజు అప్పారావు రచించిన 'గాంధీమహాత్ముడు' పాఠం ఏ ప్రక్రియకు చెందినది?", "గేయం", "గాంధీజీ మహత్తును కొనియాడుతూ రాసిన ఈ రచన గేయరూపంలో ఉంది."], ["175", "సంభాషణ ప్రక్రియకు చెందిన మరో పాఠం ఏది?", "మంచిబహుమతి", "పాత్రల నడుమ సంభాషణ రూపంలో సాగే ఈ పాఠం సంభాషణ ప్రక్రియకు చెందినది."], ["176", "'కొండవాగు' పాఠం ఏ ప్రక్రియకు చెందినది?", "వ్యాసం", "ప్రకృతి వర్ణనతో కూడిన ఈ రచన వ్యాస ప్రక్రియకు చెందినది."], ["177", "కింది వాటిలో 'గేయం' కానిది ఏది?", "తరిగొండ వేంగమాంబ", "మిగతావి గేయరూప రచనలు కాగా, ఇది వేరే ప్రక్రియకు చెందినది."], ["178", "'తృప్తి' పాఠ్యభాగం ఏ ప్రక్రియకు చెందినది?", "కథానిక", "ఇతరులకు సంతోషం కలిగించడంలో తృప్తిని పొందే పాత్ర గురించిన కథానిక ఇది."], ["179", "గేయ ప్రక్రియకు చెందిన పాఠం ఏది?", "మేలుకొలుపు", "ఉదయాన్నే నిద్రలేపుతూ సాగే గేయరూప రచన ఇది."], ["180", "'సుభాషితాలు' పాఠ్యభాగంలోని పద్యాలన్నీ ఏ ప్రక్రియకు చెందినవి?", "శతకం", "మకుటంతో కూడిన ఈ నీతి పద్యాలు శతక ప్రక్రియకు చెందినవి."], ["181", "'ధర్మనిర్ణయం' పాఠ్యభాగ ప్రక్రియ ఏమిటి?", "చారిత్రక కథ", "చరిత్రలో జరిగిన సంఘటన ఆధారంగా సాగే ఈ రచన చారిత్రక కథ ప్రక్రియకు చెందినది."], ["182", "'అక్షరం' పాఠ్యభాగ ప్రక్రియ ఏమిటి?", "వచనకవిత", "ఛందోబద్ధం కాకుండా భావ ప్రాధాన్యతతో సాగే ఈ రచన వచనకవితకు ఉదాహరణ."], ["183", "కింది వాటిలో 'లేఖ' ప్రక్రియకు చెందిన పాఠం ఏది?", "ప్రియమిత్రునికి", "స్నేహితునికి రాసిన లేఖ రూపంలో సాగే ఈ పాఠం లేఖా ప్రక్రియకు చెందినది."], ["184", "'మాయాకంబళి' పాఠ్యభాగ ప్రక్రియ ఏమిటి?", "జానపద కథ", "గ్రామీణ నేపథ్యంతో కూడిన ఈ కథ జానపద కథా ప్రక్రియకు చెందినది."], ["185", "మకుటం కలిగి ఉండే సూరుపద్యాల రచనను ఏమంటారు?", "శతకం", "ఒకే మకుటంతో ముగిసే నీతి పద్యాల సమాహారాన్ని శతకం అంటారు."], ["186", "కింది వాటిలో 'గజల్' ప్రక్రియకు చెందిన పాఠం ఏది?", "చిరమాలిన్యం", "ఉర్దూ కవితా ప్రక్రియ నుండి తెలుగులోకి వచ్చిన గజల్ శైలిలో సాగే రచన ఇది."], ["187", "తనగురించి తాను రాసుకునే సాహితీ ప్రక్రియను ఏమంటారు?", "ఆత్మకథ", "తన జీవితానుభవాలను తానే స్వయంగా రాసుకునే రచనను ఆత్మకథ అంటారు."], ["188", "మహాకావ్యాలలోని రసాత్మక ఘట్టాలను గ్రహించి రాసిన కావ్యాన్ని ఏమంటారు?", "ఖండకావ్యం", "పెద్ద కావ్యంలోని ఒక భావయుక్త భాగాన్ని ఆధారంగా చేసుకుని రాసిన చిన్న కావ్యం ఇది."], ["189", "వ్యక్తి జీవితంలో ముఖ్య సన్నివేశాన్ని లేదా సంఘటనల మధ్య సంబంధాన్ని కళాత్మకంగా చిత్రించే ప్రక్రియ ఏది?", "కథానిక", "సంక్షిప్తంగా, కళాత్మకంగా ఒక సంఘటనను చిత్రించే ప్రక్రియ కథానిక."], ["190", "'నాజర్'ను గొప్పవాడిని చేస్తానని ఎవరు అన్నారు?", "గారపాడు తాత", "గారడీ విద్యలు ప్రదర్శించే గారపాడు తాత నాజర్‌ను తీర్చిదిద్దుతానని అంటాడు."], ["191", "ఢిల్లీ రాజును చూడాలని ఎవరికి బుద్ధి పుట్టింది?", "మేక పిల్లకు", "చిన్న మేకపిల్ల ఢిల్లీ రాజును చూడాలని ప్రయాణం మొదలుపెడుతుంది."], ["192", "'మర్యాద చేద్దాం' పాఠంలో 'ఒరేయ్ పరమా!' అని కేకలు వేసినది ఎవరు?", "సోమయ్య", "పరమానందయ్య శిష్యుల కథలో ఒక పాత్ర మరొక పాత్రను ఇలా పిలుస్తుంది."], ["193", "'గోపాల్' వీరి ఆస్థానంలో విదూషకుడు?", "జయచంద్రుడు", "రాజాస్థానంలో హాస్యంతో నీతిని బోధించే విదూషకుడిగా గోపాల్ ప్రసిద్ధి పొందాడు."], ["194", "పార్వతీశం టైలర్ హైస్కూల్‌లో ఏ ఫారము చదివాడు?", "3వ ఫారము", "బారిస్టర్ పార్వతీశం విద్యాభ్యాసంలో భాగంగా ఈ తరగతిలో చదివాడు."], ["195", "'రాజు-కవి' పాఠంలో కవి తాను ఎక్కడ జీవించి ఉంటాడని చెప్పాడు?", "ప్రజల నాలుకలపై", "కవి తన కీర్తి రాతి విగ్రహాలలో కాక, ప్రజల నాలుకలపై పాటల ద్వారా నిలిచి ఉంటుందని చెప్పాడు."], ["196", "'సాయం' పాఠంలో పిచ్చుకను కాపాడడానికి ప్రయత్నించినది ఎవరు?", "రవి", "చిన్న పిచ్చుకను ఆపదనుండి కాపాడేందుకు రవి ప్రయత్నిస్తాడు."], ["197", "క్రాంతి, అక్షయలకు ఇటిజ్ పండుగ గురించి చెప్పినది ఎవరు?", "తాతయ్య", "గిరిజన సంస్కృతిని పిల్లలకు తాతయ్య వివరిస్తాడు."], ["198", "'మంచి బహుమతి' పాఠంలో వియాన్‌కు కథల పుస్తకాలను బహుమతిగా ఇచ్చినది ఎవరు?", "తాతయ్య", "మనవడికి జ్ఞానాన్నిచ్చే కథల పుస్తకాలను తాతయ్య బహుమతిగా ఇస్తాడు."], ["199", "అందరికీ భోజనం పెట్టి, తాను తిన్నట్టు ఆనందించే వ్యక్తి ఎవరు?", "పూర్ణయ్య", "ఇతరులకు ఆహారం పెట్టడంలోనే తృప్తిని పొందే పాత్ర పూర్ణయ్య."], ["200", "'సమయస్ఫూర్తి'గా వ్యవహరించి తన ప్రాణాలను కాపాడుకున్నది ఎవరు?", "పలితుడు", "చాకచక్యంగా ఆలోచించి ప్రమాదం నుండి తప్పించుకున్న పాత్ర పలితుడు."]], [["201", "'ధర్మనిర్ణయం' పాఠంలో ధర్మంకోసం సొంత కుమారునికి మరణశిక్ష విధించిన రాజు ఎవరు?", "మాధవవర్మ", "న్యాయం కోసం ఎంతటి కఠిన నిర్ణయమైనా తీసుకున్న రాజుగా మాధవవర్మ ఈ పాఠంలో చిత్రించబడ్డాడు."], ["202", "సీతాదేవికి తన కలలోని విషయాలను వివరించినది ఎవరు?", "త్రిజట", "అశోకవనంలో సీతను ఓదారుస్తూ, రాముని విజయాన్ని సూచించే కలను త్రిజట అనే రాక్షసి సీతకు చెప్పింది."], ["203", "మాయాకంబళిని రాజునుండి తీసుకొని విక్రమునికి ఇచ్చినది ఎవరు?", "చంచల", "మారువేషంలో ఉన్న చంచల ఈ మాయాకంబళిని విక్రమునికి అందించింది."], ["204", "చిన్నిశిశువు నేడు వేంకటాచలంపై ఈ విధంగా దర్శనమిస్తున్నాడు అని దేనిని ఉద్దేశించారు?", "వేంకటేశ్వరుడు", "బాలకృష్ణుని రూపమే నేడు వేంకటాచలంపై వేంకటేశ్వరునిగా దర్శనమిస్తున్నాడని కవి భావన."], ["205", "మఱ్రిచెట్టును కొట్టడానికి ప్రధాన కారకుడు ఎవరు?", "నరసింహులు", "గ్రామాభివృద్ధి పేరుతో చెట్టును కొట్టించాలని పట్టుబట్టినవారు నరసింహులు."], ["206", "విత్తనాలు చల్లి వర్షం కోసం ఆత్రుతగా ఎదురుచూస్తున్నది ఎవరు?", "పోలమ్మ", "పంట కోసం ఆరాటపడుతూ వర్షం కోసం పోలమ్మ ఎదురుచూస్తుంది."], ["207", "'మాతృభూమి' పాఠంలో దేశానికి సేవ చేయలేకపోతున్నానే బాధతో జీవిస్తున్న వ్యక్తి ఎవరు?", "వీరారావు", "దేశసేవ చేయాలన్న తపనతో కుమిలిపోతున్న పాత్ర వీరారావు."], ["208", "పూవయస్సులో వలసపోయిన తెలుగుకవితకు ఆశ్రయమిచ్చిన రాజు ఎవరు?", "రఘునాథ నాయకుడు", "తంజావూరు ఆస్థానంలో తెలుగు సాహిత్యానికి పెద్దపీట వేసిన నాయకరాజు ఇతడు."], ["209", "సాటి రైతుకు ఆశ్రయమిచ్చి ఆదుకున్న మంచి రైతు ఎవరు?", "రామప్ప", "కష్టాల్లో ఉన్న తోటి రైతుకు అండగా నిలిచిన మంచి మనసున్న రైతు రామప్ప."], ["210", "'మేక-తోక' అనే పదాలను ఉపయోగించి సీసపద్యం చెప్పిన కవి ఎవరు?", "తెనాలి రామకృష్ణుడు", "చమత్కారంగా, హాస్యస్ఫోరకంగా పద్యాలల్లడంలో నేర్పరి అయిన తెనాలి రామకృష్ణుని చాతుర్యానికి ఇది ఉదాహరణ."], ["211", "'మర్యాద చేద్దాం' పాఠంలో 'గురువుగారిల్లు కాలిపోతున్నదిరా' అని ఎవరు అన్నారు?", "శిష్యులు", "పరమానందయ్య శిష్యులు తికమకతో ఇలా కేకలు వేశారు."], ["212", "పద్యం సరైన వరుసక్రమం ఏది? (లావు గల వాని కంటెను... మావటివాడెక్కినట్లు మహిలో సుమతీ)", "2,3,1,4", "'లావు గల వానికంటెను భావింపగ నీతిపరుడు బలవంతుండౌ, గ్రామంబంత గజంబును మావటివాడెక్కినట్లు మహిలో సుమతీ' అనే సుమతీ శతక పద్యం సరైన క్రమం ఇది."], ["213", "పద్యం సరైన వరుసక్రమం ఏది? (తినగ తినగ వేము తియ్యనుండు... విశ్వదాభిరామ వినురవేమ)", "3,2,4,1", "'తినగ తినగ వేము తియ్యనుండు... సాధనమున పనులు సమకూరు ధరలోన... అనగననగ రాగమతిశయిల్లుచునుండు... విశ్వదాభిరామ వినురవేమ' అనే వేమన పద్యం క్రమం ఇది."], ["214", "పద్యం సరైన వరుసక్రమం ఏది? (బలవంతుడ నాకేమని... చలిచీమల చేతచిక్కి చావదె సుమతీ)", "4,3,1,2", "'బలవంతుడ నాకేమని పలువురతో నిగ్రహించి పలుకుట మేలా, బలవంతమైన సర్పము చలిచీమల చేతచిక్కి చావదె సుమతీ' అనే సుమతీ శతక పద్యం క్రమం ఇది."], ["215", "పద్యం సరైన వరుసక్రమం ఏది? (కులము కన్న మిగుల గుణము... విశ్వదాభిరామ వినురవేమ)", "4,3,1,2", "'మాటకన్నెంచ మనసు దృఢము, పూజకన్న నెంచ బుద్ధి ప్రధానంబు, కులముకన్న మిగుల గుణము ప్రధానంబు, విశ్వదాభిరామ వినురవేమ' అనే వేమన పద్యం క్రమం ఇది."], ["216", "'గోపాల్ తెలివి' పాఠంలో 'ఆకాశంలో ఎన్ని నక్షత్రాలున్నాయి' అని ప్రశ్నించినది ఎవరు?", "జయచంద్రుడు", "గోపాల్ తెలివిని పరీక్షించడానికి రాజు జయచంద్రుడు ఈ చిక్కు ప్రశ్న వేశాడు."], ["217", "'సాయం' పాఠంలో 'మరి దాన్ని ఎవరు కాపాడతారు నాన్నా?' అని అడిగినది ఎవరు?", "రవి", "గాయపడిన పిచ్చుక గురించి ఆందోళనతో రవి తన తండ్రిని ఇలా అడిగాడు."], ["218", "పెదనాన్న, క్రాంతి, అక్షయలకు దేనిగురించి వివరంగా చెప్పారు?", "ఇటిజ్ పండుగ", "గిరిజన సంస్కృతిలో భాగమైన ఈ పండుగ విశిష్టతను పెదనాన్న పిల్లలకు వివరించారు."], ["219", "'అష్టఘంటాలు' పేరుతో రాతగాళ్ళను నియమించి ఏకకాలంలో దృచించగలిగిన కవయిత్రి ఎవరు?", "రంగాజమ్మ", "ఎనిమిది మంది రాతగాళ్లకు ఏకకాలంలో వేర్వేరు రచనలు చెప్పించగల ప్రతిభాశాలి రంగాజమ్మ."], ["220", "'దూ దూ బసవన్న' పాఠంలో 'ఈ విద్య నాతోనే ఆఖరుసార్' అని అన్నది ఎవరు?", "బసవయ్య", "తన విద్యను కొనసాగించలేని పరిస్థితిపై బాధతో బసవయ్య ఇలా అన్నాడు."], ["221", "'నేను ధర్మనిర్ణయం గూర్చి విచారించడం లేదు' అని బాధతో చెప్పినది ఎవరు?", "మాధవవర్మ", "న్యాయనిర్ణయం వెనుక తనకు కలిగిన మనోవేదనను మాధవవర్మ ఇలా వ్యక్తం చేశాడు."], ["222", "'మమకారం' పాఠంలో అచ్చతెలుగు కుటుంబాన్ని చూశానని ఆనందం వ్యక్తం చేసినది ఎవరు?", "రాజు", "సాంప్రదాయ తెలుగు జీవన విధానాన్ని చూసి రాజు సంతోషం వ్యక్తం చేశాడు."], ["223", "పద్యం సరైన వరుసక్రమం ఏది? (దొరలు దోచలేరు... లలిత సుగుణజాల తెలుగుబాల)", "4,1,3,2", "'దొరలు దోచలేరు దొంగలెత్తుకపోరు, భ్రాతృజనము వచ్చి పంచుకోరు, విశ్వవర్ధనంబు విద్యాధనంబురా, లలిత సుగుణజాల తెలుగుబాల' పద్యం క్రమం ఇది."], ["224", "పద్యం సరైన వరుసక్రమం ఏది? (క్షమ గురించిన నాలుగు పాదాలు)", "2,4,3,1", "క్షమ వల్ల కలిగే సిరిసంపదలు, సౌఖ్యం, దేవుని అనుగ్రహాల గురించి తెలిపే ఈ పద్యం క్రమం ఇది."], ["225", "'భయమేల గొల్తెదు భామ నీవిపుడు' అని అన్నది ఎవరు?", "బాలచంద్రుడు", "యుద్ధభూమికి బయలుదేరే ముందు తన భార్యతో బాలచంద్రుడు ధైర్యంగా ఇలా పలికాడు."], ["226", "మాయాకంబళి కథలో 'రాజ్యశ్రేయస్సు దృష్ట్యా ఇది నా దగ్గర ఉండటమే మంచిది' అని రాజు ఎవరితో అన్నారు?", "విక్రమునితో", "మాయాకంబళిని తన దగ్గరే ఉంచుకోవాలని రాజు విక్రమునితో ఇలా అన్నాడు."], ["227", "'నేనిప్పుడే చెరువు గట్టు మీద మొద్దునైపడి ఉన్నాను' అని తన స్వగతాన్ని చెప్పుకున్నది ఏది?", "మఱ్రిచెట్టు", "కొట్టివేయబడిన తర్వాత తన స్థితిని మఱ్రిచెట్టు ఇలా వాపోయింది."], ["228", "పద్యం సరైన వరుసక్రమం ఏది? (వినయమగు వివేకి... మాచిరాజు మాట మణుల మూట)", "2,3,1,4", "నిండు నదులు నిశ్శబ్దంగా ప్రవహించినట్లే, వివేకి కూడా అణకువగా ఉంటాడని తెలిపే పద్యం క్రమం ఇది."], ["229", "'మాతృభూమి' పాఠంలో 'సైన్యంలో చేరినవాళ్ళంతా చావరు నాన్నా!' అని అన్నది ఎవరు?", "వీర", "సైన్యంలో చేరాలనుకుంటున్న తన కొడుకును వీర ఇలా ఓదార వం' ఇతివృత్తంగా గల పాఠం ఏది?", "మఱ్రిచెట్టు", "మనుషుల స్వార్థ ప్రవృత్తిని చెట్టు దృక్కోణం నుండి చిత్రించే పాఠం ఇది."], ["246", "'చిన్నిశిశువు' పాఠ్యాంశ ఇతివృత్తం ఏమిటి?", "శైశవ వర్ధన", "బాలకృష్ణుని శైశవదశ ఎదుగుదలను వర్ణించే పాఠం ఇది."], ["247", "'జీవన వైవిధ్యం' ఇతివృత్తంగా గల పాఠం ఏది?", "ఎంత మంచివారమ్మా..!", "వివిధ జీవన శైలులను, వైవిధ్యాన్ని చిత్రించే పాఠం ఇది."], ["248", "'మమకారం' పాఠ్యభాగ ఇతివృత్తం ఏమిటి?", "సహానుభూతి", "ఇతరుల కష్టాలను అర్థం చేసుకునే సహానుభూతి భావనను తెలిపే పాఠం ఇది."], ["249", "'స్థలపురాణం' ఇతివృత్తంగా గల పాఠం ఏది?", "కొండవాగు", "ఒక ప్రాంత చారిత్రక, పౌరాణిక నేపథ్యాన్ని వివరించే పాఠం ఇది."], ["250", "'ఆత్మస్థైర్యం' ఇతివృత్తంగా గల పాఠం ఏది?", "చిరమాలిన్యం", "కష్టాల్లోనూ ధైర్యం కోల్పోకుండా ముందుకు సాగే స్థైర్యాన్ని చెప్పే పాఠం ఇది."]]];
const LABELS = ["1-50","51-100","101-150","151-200","201-250"];

const list = document.getElementById('qlist');
const tabsEl = document.getElementById('tabs');
let QA = SETS[0];
let currentCard = null;
let playAllActive = false;
let runId = 0;

function speakText(text) {
  return new Promise((resolve) => {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'te-IN';
      u.rate = 0.92;
      u.onend = () => resolve();
      u.onerror = () => resolve();
      window.speechSynthesis.speak(u);
    } catch (e) {
      resolve();
    }
  });
}

async function readCard(card, item) {
  if (currentCard && currentCard !== card) currentCard.classList.remove('playing');
  currentCard = card;
  card.classList.add('playing');
  window.speechSynthesis.cancel();
  const my = ++runId;
  await speakText('ప్రశ్న ' + item[0] + '. ' + item[1]);
  if (my !== runId) return;
  await speakText('జవాబు: ' + item[2]);
  if (my !== runId) return;
  await speakText(item[3]);
  if (my !== runId) return;
  card.classList.remove('playing');
  if (currentCard === card) currentCard = null;
}

function stopAll() {
  playAllActive = false;
  runId++;
  window.speechSynthesis.cancel();
  if (currentCard) { currentCard.classList.remove('playing'); currentCard = null; }
}

function buildCards() {
  list.innerHTML = '';
  QA.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML =
      '<span class="qnum">ప్రశ్న ' + item[0] + '</span>' +
      '<p class="qtext">' + item[1] + '</p>' +
      '<div class="answer-row"><span class="answer">జవాబు: ' + item[2] + '</span><span class="play-icon">🔊</span></div>' +
      '<div class="expl">' + item[3] + '</div>';
    card.addEventListener('click', () => {
      playAllActive = false;
      readCard(card, item);
    });
    list.appendChild(card);
  });
}

function selectSet(i) {
  stopAll();
  QA = SETS[i];
  document.querySelectorAll('.tab').forEach((t, k) => t.classList.toggle('active', k === i));
  buildCards();
  window.scrollTo({top: 0});
}

LABELS.forEach((l, i) => {
  const b = document.createElement('button');
  b.className = 'tab' + (i === 0 ? ' active' : '');
  b.textContent = l;
  b.addEventListener('click', () => selectSet(i));
  tabsEl.appendChild(b);
});

document.getElementById('playAllBtn').addEventListener('click', async () => {
  stopAll();
  playAllActive = true;
  const cards = document.querySelectorAll('.qcard');
  const snapshot = QA;
  for (let i = 0; i < cards.length; i++) {
    if (!playAllActive || snapshot !== QA) break;
    cards[i].scrollIntoView({behavior: 'smooth', block: 'center'});
    await readCard(cards[i], QA[i]);
    if (currentCard === cards[i]) break;
  }
  playAllActive = false;
});

document.getElementById('stopBtn').addEventListener('click', stopAll);

buildCards();
</script>
